<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ملف المعلمة | إدارة المدرسة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
  </head>
  <body class="app-shell profile-page" data-page="profile">
    <a class="skip-link" href="#main-content">تخطي إلى المحتوى الرئيسي</a>
    <header class="site-header">
      <div class="site-header__inner container">
        <a class="brand" href="../index.html" id="home-link">
          <span class="brand__mark" aria-hidden="true">و</span>
          <span class="brand__text">
            <span class="brand__title">إدارة المدرسة</span>
            <span class="brand__subtitle">منصة وكيلة المدرسة</span>
          </span>
        </a>
        <div class="site-header__actions" id="account-actions" hidden>
          <span id="account-name">
          </span>
          <button id="logout-button" class="ui-button" type="button">تسجيل الخروج</button>
        </div>
      </div>
    </header>
    <main id="main-content" class="main-content" hidden>
      <section class="container">
        <nav id="teacher-navigation" class="teachers-toolbar" aria-label="أنشطتي" hidden>
          <a class="ui-button" href="activity-details.html" id="teacher-add-link">إضافة نشاط</a>
          <a class="ui-button" href="teacher-profile.html" id="teacher-activities-link">نشاطاتي</a>
        </nav>
        <!-- Back -->
        <a
          class="profile-back-link"
          href="teachers.html"
          id="activities-back-link"
          >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
            >
            <path d="M19 12H5">
            </path>
            <path d="m11 18-6-6 6-6">
            </path>
          </svg>
          <span>
            العودة إلى المعلمات
          </span>
        </a>
        <!-- Page heading -->
        <header class="activities-heading">
          <div>
            <p class="eyebrow">
              ملف المعلمة
            </p>
            <h1 id="activities-title">
              أنشطة المعلمة
            </h1>
            <p id="activities-subtitle">
              استعرضي الأنشطة والمشاركات التي قدمتها المعلمة.
            </p>
          </div>
          <div
            class="activities-count"
            aria-label="عدد الأنشطة"
            >
            <strong id="activities-count-number">0</strong>
            <span>
              أنشطة
            </span>
          </div>
        </header>
        <div id="admin-professional-profile" hidden></div>
        <div class="activities-toolbar">
          <a class="ui-button ui-button--primary" id="add-activity-button" href="activity-details.html">إضافة نشاط</a>
        </div>
        <div id="activities-empty-state" class="empty-state empty-state--inline" hidden>
          <span class="empty-state__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M7 7h10v10H7z" />
              <path d="M9 3v4M15 3v4M6 9h12" />
            </svg>
          </span>
          <p class="empty-state__title">لا توجد أنشطة مسجلة بعد</p>
          <p class="empty-state__description">أضيفي نشاطًا جديدًا لتظهر هنا في ملف المعلمة.</p>
          <div class="empty-state__actions">
            <a class="ui-button ui-button--primary" href="activity-details.html">إضافة نشاط</a>
          </div>
        </div>
        <h2 id="legacy-activities-title" hidden>أنشطة سابقة</h2>
        <section
          id="activities-list"
          class="activities-grid"
          aria-label="قائمة الأنشطة"
          >
        </section>
      </section>
    </main>
    <p id="global-status" class="container form-status" role="alert">
    </p>
    <noscript>يرجى تفعيل JavaScript لاستخدام النظام.</noscript>
    <script src="../js/data.js" defer>
    </script>
    <script src="../js/teacher-professional.js" defer></script>
<script src="../js/app.js" defer>
    </script>
    <script src="../js/teachers.js" defer>
    </script>
    <script src="../js/interactions.js" defer>
    </script>
  </body>
</html>
